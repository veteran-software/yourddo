name: YourDDO - Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Enable Corepack
      run: corepack enable

    - run: yarn install --immutable --mode=skip-build
    - run: yarn lint
    - run: yarn test
    - run: yarn build

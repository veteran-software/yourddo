version: 1

applications:
  - appRoot: v2

    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 24
            - corepack enable
            - yarn install --immutable

        build:
          commands:
            - yarn build

      artifacts:
        baseDirectory: dist
        files:
          - '**/*'

      cache:
        paths:
          - node_modules/**/*
          - .yarn/cache/**/*
